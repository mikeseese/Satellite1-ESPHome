## Custom Micro Wake Word Models Template
##
## Use this file as a template for adding custom microWakeWord models to your
## Satellite1 device without forking the Satellite1-ESPHome firmware repo.
##
## How to use:
##   1. Create a new public GitHub repository (e.g. "my-satellite1-wake-words").
##   2. Copy this file into your repo and rename it (e.g. "micro_wake_words.yaml").
##   3. Edit the model entries below to point to your custom wake word model JSON
##      manifests (hosted on GitHub or any public URL).
##   4. In your Satellite1 ESPHome dashboard YAML, add the following package entry:
##
##      packages:
##        custom_micro_wake_words:
##          url: https://github.com/your-username/your-wake-word-repo
##          ref: main
##          files:
##            - micro_wake_words.yaml
##          refresh: 1d
##
##   5. Rebuild your firmware from the ESPHome dashboard in Home Assistant.
##
## For available community wake word models, see:
##   https://github.com/kahrendt/microWakeWord
##
## Model source formats supported:
##   - HTTP URL:  https://github.com/<user>/microWakeWord/releases/download/<tag>/<model>.json
##   - Git repo:
##       model:
##         type: git
##         url: https://github.com/<user>/microWakeWord
##         file: models/<model>.json
##         ref: main
##   - Built-in name:  hey_jarvis  (fetches from the default ESPHome model repo)
##
## Example: Add a custom wake word model from an HTTP URL.
## Replace the model URL and id with your own.
## The id "mww" must match to extend the default micro_wake_word component.
##
## To remove one of the default wake word models, add an entry like:
##   - id: !remove hey_jarvis

micro_wake_word:
  id: mww
  models:
    - id: my_custom_wake_word
      model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
